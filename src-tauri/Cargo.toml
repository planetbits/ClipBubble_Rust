[package]
name = "clipbubble"
version = "0.1.0"
description = "A floating clipboard manager for Windows"
authors = ["Claude Code"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0.0-beta", features = [] }

[dependencies]
tauri = { version = "2", features = ["default", "tray-icon"] }
tauri-plugin-shell = "2"
tauri-plugin-global-shortcut = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
arboard = "3.2.0"
enigo = "0.1.2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.52.0", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_LibraryLoader",
] }

[profile.dev]
incremental = true # Keeps dependency builds cached during testing

[profile.release]
strip = true
incremental = true
opt-level = 3
lto = "thin" # Speeds up linking phase significantly

[profile.release.package."*"]
opt-level = 3
